<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <link rel="stylesheet" href="./projects.css">
    <link rel="stylesheet" href="https://use.typekit.net/sxw2bps.css">
</head>
<body>

    <header class="navbar container">
        <h1 class="logo">PROJECTS</h1>

        <nav>
            <ul class="menu">
                <li><a href="./index.html">Main</a></li>
                <li><a href="./aboutme.html">About me</a></li>
            </ul>
        </nav>
    </header>

    <!-- FILTRI -->
    <section class="filters container">
        <ul>
            <li><button class="filter-btn active" data-filter="all">All</button></li>
            <li><button class="filter-btn" data-filter="graphics">Graphics and illustrations</button></li>
            <li><button class="filter-btn" data-filter="editorial">Editorial design</button></li>
            <li><button class="filter-btn" data-filter="branding">Branding and corporate design</button></li>
            <li><button class="filter-btn" data-filter="web">Web design</button></li>
        </ul>
    </section>

    <!-- GRIGLIA -->
    <main class="container">
        <section class="projects-grid">

            <a href="#" class="project-card" data-category="graphics">
                <img src="./img/graphics/elementi visivi/contrasto.pdf">
            </a>

            <a href="#" class="project-card" data-category="graphics">
                <img src="./img/graphics/elementi visivi/23-24_Es04_AmodioGiulia_1_Caratteri.pdf">
            </a> 

            <a href="#" class="project-card" data-category="graphics">
                <img src="./img/graphics/disegno/Vinile (trascinato).pdf">
            </a>

            <a href="#" class="project-card" data-category="graphics">
                <img src="./img/graphics/disegno/3.png">
            </a>

            <a href="#" class="project-card" data-category="editorial">
                <img src="./img/editoria/bibbia/vangeli.JPG">
            </a>

            <a href="#" class="project-card" data-category="editorial">
                <img src="./img/editoria/fondamenti/copertina_.png">
            </a>

            <a href="#" class="project-card" data-category="editorial">
                <img src="./img/editoria/binga/foto copertina.jpg">
            </a>


            <a href="#" class="project-card" data-category="editorial">
                <img src="./img/editoria/camminare/camminare-6.jpg">
            </a>

            <a href="#" class="project-card" data-category="web">
                <img src="./img/web/1.png">
            </a>

             <a href="#" class="project-card" data-category="branding">
                <img src="./img/branding/hacienda brandbook/PHOTO-2025-01-21-17-34-59 3.jpg">
            </a>

            <a href="#" class="project-card" data-category="branding">
                <img src="./img/branding/thespaceship/MOCKUP.png">
            </a>

             <a href="#" class="project-card" data-category="branding">
                <img src="./img/branding/flanerie/titolo.JPG">
            </a>
        </section>
    </main>

    <script>
        const buttons = document.querySelectorAll(".filter-btn");
        const cards = document.querySelectorAll(".project-card");

        buttons.forEach(button => {
            button.addEventListener("click", () => {

                // attiva bottone
                buttons.forEach(btn => btn.classList.remove("active"));
                button.classList.add("active");

                const filter = button.dataset.filter;

                cards.forEach(card => {
                    if (filter === "all" || card.dataset.category === filter) {
                        card.style.display = "block";
                    } else {
                        card.style.display = "none";
                    }
                });

            });
        });
    </script>

</body>
</html>
